<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task ME — งาน · ไทม์ไลน์ · ค่าใช้จ่ายของครอบครัว</title>
<meta name="description" content="Task ME — จัดการงาน ปฏิทิน ไทม์ไลน์หลักฐาน และค่าใช้จ่าย แชร์กับครอบครัว">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F2F4F8">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TaskME">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  color-scheme: light;
  --bg:#F2F4F8;            /* light cool gray */
  --bg2:#E7EAF0;
  --panel:#FFFFFF;         /* pure white cards */
  --ink:#111827;
  --muted:#8B909C;
  --line:#ECEEF2;
  --clay:#2F6BFF;          /* iOS blue accent */
  --clay-d:#2457D6;
  --clay-soft:#EAF1FF;
  /* pastels (project colors / avatars) */
  --coral:#E8A08D; --sage:#9EBE9F; --sky:#98BBD4; --lav:#B9A9D6; --butter:#E3C57F; --rose:#DFA3B6;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 12px 30px rgba(17,24,39,.06);
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Segoe UI","Sarabun","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.hdr-in{max-width:1080px;margin:0 auto;padding:14px 26px;display:flex;align-items:center;gap:18px;}
.logo{display:flex;align-items:center;gap:10px;}
.logo .mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#4C8BFF,#2F6BFF);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 12px rgba(47,107,255,.32);}
.logo .name{font-weight:800;font-size:17px;}
.logo .name span{color:var(--clay);}
/* workspace segmented */
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:3px;}
.seg button{padding:7px 16px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:7px;transition:.15s;}
.seg button.on{background:var(--panel);color:var(--clay);box-shadow:0 1px 3px rgba(17,24,39,.1);}
.spacer{flex:1;}
.uav{width:34px;height:34px;border-radius:50%;background:var(--clay);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;}
.gear{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:16px;transition:.15s;}
.gear:hover{background:var(--clay-soft);border-color:var(--clay);}
.gear.on{background:var(--clay);border-color:var(--clay);}

/* subtabs */
.subbar{max-width:1080px;margin:0 auto;padding:0 26px;display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);}
.subtab{padding:14px 16px;font-weight:700;font-size:14.5px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;transition:.15s;}
.subtab:hover{color:var(--ink);}
.subtab.on{color:var(--clay);border-color:var(--clay);}
.subbar .members{margin-left:auto;display:flex;align-items:center;gap:10px;padding:8px 0;}
.avstack{display:flex;}
.avstack .mini-av{margin-left:-7px;border:2px solid var(--bg);}
.avstack .mini-av:first-child{margin-left:0;}

/* floating bottom nav + FAB (iOS style) */
#tabbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:4px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:7px 8px;
  box-shadow:0 10px 34px rgba(17,24,39,.14);}
.tabbar-item{width:52px;height:46px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:19px;color:var(--muted);transition:.15s;}
.tabbar-item .tl{font-size:9.5px;font-weight:800;letter-spacing:.2px;}
.tabbar-item.on{background:var(--clay);color:#fff;box-shadow:0 6px 16px rgba(47,107,255,.36);}
#fab{position:fixed;right:22px;bottom:92px;z-index:41;width:58px;height:58px;border-radius:50%;background:#111827;color:#fff;
  font-size:28px;font-weight:300;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 30px rgba(17,24,39,.34);transition:.15s;}
#fab:hover{transform:translateY(-2px) scale(1.04);}
#fab.hide{display:none;}

/* main */
.wrap{max-width:1080px;margin:0 auto;padding:24px 26px 120px;}
.pagehead{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;}
.pagehead h1{font-size:22px;font-weight:800;}
.pagehead .sub{color:var(--muted);font-size:13.5px;margin-top:3px;}

.btn{background:var(--clay);color:#fff;font-weight:700;font-size:13.5px;padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);transition:.15s;}
.btn:hover{background:var(--clay-d);transform:translateY(-1px);}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:none;}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.panel h3{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.panel h3 .more{margin-left:auto;font-size:12.5px;color:var(--clay);font-weight:700;cursor:pointer;}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
.mini-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:10px;flex:none;}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none;}

/* tasks */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.chip{font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);}
.chip.on{background:var(--clay);color:#fff;border-color:var(--clay);}
.task{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:12px;transition:.12s;}
.task:hover{background:var(--clay-soft);}
.task + .task{border-top:1px solid var(--line);}
.check{width:21px;height:21px;border-radius:7px;border:2px solid #D9D2C4;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;transition:.15s;}
.task.done .check{background:var(--sage);border-color:var(--sage);}
.task.done .t-title{text-decoration:line-through;color:var(--muted);}
.t-body{flex:1;min-width:0;}
.t-title{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.t-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap;}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;}
.pri{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;}
.pri.high{background:#FFE4E1;color:#E5484D;}
.pri.mid{background:#FFF1D6;color:#B7791F;}
.pri.low{background:#E4F3E7;color:#2F9E44;}
.mail-badge{font-size:11px;color:var(--clay);font-weight:700;}
.due{font-size:12px;color:var(--muted);font-weight:600;}
.addrow{display:flex;gap:10px;margin-bottom:14px;}
.addrow input,.field,select.field{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;font-family:inherit;background:var(--panel);color:var(--ink);outline:none;}
.field:focus,.addrow input:focus{border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft);}

/* stat cards */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:6px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.stat .blob{position:absolute;right:-14px;top:-14px;width:56px;height:56px;border-radius:50%;opacity:.5;}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:700;}
.stat .v{font-size:28px;font-weight:800;margin-top:6px;}
.stat .v small{font-size:13px;color:var(--muted);font-weight:600;}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);}
.kcol h4{font-size:13px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.kcol h4 .cnt{margin-left:auto;color:var(--muted);}
.kcard{background:#F7F8FA;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;}
.kcard .kt{font-weight:600;font-size:13.5px;margin-bottom:9px;}
.kcard .kf{display:flex;align-items:center;gap:8px;}
.kmove{margin-left:auto;display:flex;gap:4px;}
.kmove button{width:25px;height:25px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:800;}
.kmove button:hover{background:var(--clay-soft);color:var(--clay);}

/* calendar */
.cal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:#F7F8FA;border-bottom:1px solid var(--line);}
.cal-head div{padding:10px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cell{min-height:98px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;}
.cell .dn{font-size:12.5px;font-weight:700;color:var(--muted);}
.cell.today .dn{background:var(--clay);color:#fff;border-radius:8px;padding:1px 7px;}
.cell.dim{background:#F7F8FA;}
.ev{font-size:11px;font-weight:700;color:#3A4252;border-radius:7px;padding:2px 7px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* timeline / cases */
.banner{background:linear-gradient(120deg,#EAF1FF,#F2F6FF);border:1px solid #DCE7FF;border-radius:16px;padding:13px 16px;font-size:13px;color:#2457D6;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
.case{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;margin-bottom:14px;}
.case:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(120,90,60,.1);}
.case-top{display:flex;align-items:center;gap:12px;}
.case .cemoji{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;}
.case .cname{font-weight:800;font-size:16px;}
.case .cmeta{font-size:12.5px;color:var(--muted);margin-top:2px;}
.status{font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:999px;}
.status.open{background:#F7DED5;color:#B4522F;}
.status.prog{background:#F5EAD0;color:#9A7B2E;}
.status.closed{background:#E4EEE4;color:#4F7A52;}
.case-foot{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--muted);font-size:12.5px;font-weight:600;}

.tl{position:relative;padding-left:26px;margin-top:6px;}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 20px 8px;}
.tl-item:before{content:"";position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--clay);}
.tl-item.pastel-sage:before{border-color:var(--sage);}
.tl-item.pastel-sky:before{border-color:var(--sky);}
.tl-date{font-size:12px;color:var(--clay);font-weight:800;}
.tl-what{font-size:14px;margin-top:3px;line-height:1.5;}
.tl-ev{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);background:#EEF1F6;border:1px solid var(--line);padding:2px 8px;border-radius:999px;margin-top:7px;}

/* members */
.member{display:flex;align-items:center;gap:12px;padding:13px 6px;}
.member + .member{border-top:1px solid var(--line);}
.member .mname{font-weight:700;font-size:14px;}
.member .mrole{font-size:12px;color:var(--muted);}
.perm{margin-left:auto;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;}
.perm.owner{background:var(--clay-soft);color:var(--clay);}
.perm.edit{background:#E4EEE4;color:#4F7A52;}
.perm.view{background:#EFEAF7;color:#6E5AA0;}
.sharelink{display:flex;gap:10px;align-items:center;background:#F7F8FA;border:1px dashed var(--line);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--muted);margin-top:14px;}
.sharelink code{color:var(--ink);font-weight:700;}
.conn-card{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:13px;margin-bottom:12px;}
.conn-card .ci{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#F7F8FA;}
.conn-card .ct{font-weight:700;font-size:14px;}
.conn-card .cs{font-size:12.5px;color:var(--muted);}
.pill-ok{margin-left:auto;font-size:12px;font-weight:800;color:#4F7A52;background:#E4EEE4;padding:5px 11px;border-radius:999px;}
.section-title{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.05em;margin:24px 0 12px;text-transform:uppercase;}

/* expenses */
.exp-total{background:linear-gradient(135deg,#EAF1FF,#F2F6FF);border:1px solid #DCE7FF;border-radius:16px;padding:20px 22px;margin-bottom:18px;}
.exp-total .lbl{font-size:12.5px;font-weight:700;color:var(--clay-d);}
.exp-total .amt{font-size:34px;font-weight:800;color:var(--clay-d);margin-top:4px;}
.exp-total .amt small{font-size:15px;font-weight:700;}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.bar-row .bl{width:130px;font-size:13px;font-weight:700;flex:none;display:flex;align-items:center;gap:6px;}
.bar-track{flex:1;height:12px;border-radius:999px;background:var(--bg2);overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;}
.bar-row .bv{width:92px;text-align:right;font-size:12.5px;font-weight:700;color:var(--muted);flex:none;}
.exp{display:flex;align-items:center;gap:12px;padding:13px 8px;}
.exp + .exp{border-top:1px solid var(--line);}
.exp .et{font-weight:600;font-size:14px;}
.exp .em{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.exp .ea{margin-left:auto;font-weight:800;font-size:15px;flex:none;}
.exp .del{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:14px;flex:none;}
.exp .del:hover{background:#F7DED5;color:#B4522F;border-color:#F0C4B4;}
/* settings */
.prow{display:flex;align-items:center;gap:12px;padding:13px 6px;}
.prow + .prow{border-top:1px solid var(--line);}
.prow .pe{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;}
.prow .pn{font-weight:700;font-size:14px;}
.prow .del{margin-left:auto;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:15px;flex:none;}
.prow .del:hover{background:#F7DED5;color:#B4522F;border-color:#F0C4B4;}
.swatches{display:flex;gap:8px;margin-top:6px;}
.sw{width:30px;height:30px;border-radius:9px;cursor:pointer;border:3px solid transparent;}
.sw.on{border-color:var(--ink);}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.32);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal{background:var(--panel);border-radius:20px;width:100%;max-width:450px;padding:24px;box-shadow:0 30px 80px rgba(17,24,39,.22);}
.modal h3{font-size:17px;font-weight:800;margin-bottom:14px;}
.modal label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 6px;}
.modal .row{display:flex;gap:10px;}
.checkline{display:flex;align-items:center;gap:9px;margin-top:16px;font-size:13.5px;font-weight:600;background:#F7F8FA;border:1px solid var(--line);padding:11px 13px;border-radius:12px;}
.checkline input{width:18px;height:18px;accent-color:var(--clay);}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

.hide{display:none!important;}
@media(max-width:820px){
  .grid2,.kanban{grid-template-columns:1fr;}
  .cards{grid-template-columns:repeat(2,1fr);}
  .hdr-in,.subbar,.wrap{padding-left:16px;padding-right:16px;}
  .subbar .members .avstack{display:none;}
}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-in">
    <div class="logo"><div class="mark">TM</div><div class="name">Task<span>ME</span></div></div>
    <div class="seg" id="wsSeg">
      <button data-ws="personal" class="on">👤 ส่วนตัว</button>
      <button data-ws="shared">👨‍👩‍👧 แชร์</button>
    </div>
    <div class="spacer"></div>
    <span class="syncpill" id="syncPill" title="สถานะการซิงก์กับ Google Sheet"></span>
    <button class="gear" id="gearBtn" onclick="go(null,'settings')" title="ตั้งค่า">⚙️</button>
    <div class="uav" id="uav" onclick="go(null,'settings')" title="โปรไฟล์">ม</div>
  </div>
  <div class="subbar" id="subbar"></div>
</header>
<main class="wrap" id="main"></main>
<nav id="tabbar"></nav>
<button id="fab" onclick="fabAction()" title="เพิ่มรายการ">＋</button>
<div id="modalRoot"></div>

<div id="loginOverlay">
  <div class="login-card">
    <div class="login-mark">TM</div>
    <div class="login-title">Task<span>ME</span></div>
    <div class="login-sub">งาน · ปฏิทิน · ไทม์ไลน์ · ค่าใช้จ่าย ของครอบครัว</div>
    <div id="gbtn" class="gbtn-wrap"></div>
    <div class="login-note">ล็อกอินด้วยบัญชี Google ที่อยู่ในรายชื่อสมาชิก</div>
    <div id="loginErr" class="login-err"></div>
  </div>
</div>
<style>
#loginOverlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--bg),var(--bg2));padding:24px;}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  padding:40px 34px;max-width:360px;width:100%;text-align:center;}
.login-mark{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
  background:var(--clay);color:#fff;font-weight:900;font-size:24px;letter-spacing:.5px;box-shadow:0 8px 20px rgba(47,107,255,.28);}
.login-title{font-size:26px;font-weight:900;color:var(--ink);}
.login-title span{color:var(--clay);}
.login-sub{color:var(--muted);font-size:13px;margin:6px 0 26px;line-height:1.5;}
.gbtn-wrap{display:flex;justify-content:center;min-height:44px;}
.login-note{color:var(--muted);font-size:12px;margin-top:18px;}
.login-err{color:#B4453B;font-size:12.5px;margin-top:14px;font-weight:700;white-space:pre-line;}
.syncpill{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--muted);}
.syncpill.ok{background:#E4EEE4;color:#4F7A52;}
.syncpill.err{background:#F6E4E1;color:#B4453B;}
.syncpill.busy{background:#EFEAF7;color:#6E5AA0;}
.syncpill:empty{display:none;}
</style>

<script>
/* ---------------- pastel palette for projects ---------------- */
const PAL={coral:'#E8A08D',sage:'#9EBE9F',sky:'#98BBD4',lav:'#B9A9D6',butter:'#E3C57F',rose:'#DFA3B6'};
const tint=(hex)=>hex+'33';

/* ---------------- backend config (Apps Script Web App + Google Login) ---------------- */
const API_URL='https://script.google.com/macros/s/AKfycbwnk5vz06WLZAMdCDznwMi2Rv0uRrL5jgDtjxyKFtXeEY8ZlhoRlZceqfZeVGYu5Oif/exec';
const CLIENT_ID='893425372084-thvcg6cf0ne71c1n98pp6sagkvpldetg.apps.googleusercontent.com';
let ID_TOKEN=null;     // Google ID token (JWT) หลังล็อกอิน
let MEID='me';         // member_id ของผู้ใช้ที่ล็อกอินอยู่
let ONLINE=false;      // true = โหลดข้อมูลจาก backend สำเร็จแล้ว
const lastPushed={personal:'',shared:''};
let pushTimer=null;
const canEdit=()=>ws==='personal'||['owner','edit'].includes(((mem(MEID)||{}).perm)||'view');

/* ---------------- members ---------------- */
// placeholder ก่อนล็อกอิน — หลังล็อกอิน applyBootstrap() จะแทนที่ด้วยสมาชิกจริงจากชีต
let members=[
  {id:'me', name:'มาร์ท', role:'เจ้าของ', color:'#D97757', av:'ม', perm:'owner'},
];
const mem=id=>members.find(m=>m.id===id);

/* ---------------- data per workspace ---------------- */
// เริ่มต้นว่าง — หลังล็อกอิน applyBootstrap() จะแทนที่ด้วยข้อมูลจริงจาก Google Sheet
let DATA={
  personal:{ label:'พื้นที่ส่วนตัว', sub:'งานและบันทึกของฉัน',
    projects:[], tasks:[], events:[], cases:[], expenses:[] },
  shared:{ label:'พื้นที่ครอบครัว', sub:'แชร์กับทุกคนในบ้าน · ล็อกอินด้วย Google',
    projects:[], tasks:[], events:[], cases:[], expenses:[] },
};

/* ---------------- state ---------------- */
let ws='personal', tab='task', caseOpen=null;
const D=()=>DATA[ws];
const proj=id=>D().projects.find(p=>p.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
function avatar(id,cls='mini-av'){const m=mem(id);if(!m)return '';return `<span class="${cls}" style="background:${m.color}" title="${esc(m.name)}">${esc(m.av)}</span>`;}
function ptag(pid){const p=proj(pid);if(!p)return '';return `<span class="tag" style="background:${tint(p.color)};color:#6a5540">${p.emoji} ${esc(p.name)}</span>`;}
const priLabel={high:'ด่วน',mid:'ปานกลาง',low:'ทั่วไป'};
const statusLabel={open:'ยังไม่จบ',prog:'กำลังแก้',closed:'ปิดเคสแล้ว'};
const baht=n=>Number(n).toLocaleString('en-US');

/* ---------------- date + Google Calendar helpers ---------------- */
const THMONTH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const pad2=n=>String(n).padStart(2,'0');
const isoOf=(y,m,day)=>`${y}-${pad2(m+1)}-${pad2(day)}`;
function todayISO(){const n=new Date();return isoOf(n.getFullYear(),n.getMonth(),n.getDate());}
function isoToThai(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));if(!m)return String(s||'');return Number(m[3])+' '+THMONTH[Number(m[2])-1]+' '+(Number(m[1])+543);}
// สร้างลิงก์ "เพิ่มลง Google Calendar" แบบ template (ผู้ใช้กดยืนยันเองในหน้า Google) — ไม่ต้องขอสิทธิ์พิเศษ
function gcalUrl(title,iso,time){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));let dates='';
  if(m){
    const ymd=m[1]+m[2]+m[3];
    if(time&&/^\d{2}:\d{2}$/.test(time)){
      const st=ymd+'T'+time.replace(':','')+'00';
      const hh=pad2((Number(time.slice(0,2))+1)%24);const en=ymd+'T'+hh+time.slice(3,5)+'00';dates=st+'/'+en;
    }else{
      const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3])+1);
      dates=ymd+'/'+isoOf(d.getFullYear(),d.getMonth(),d.getDate()).replace(/-/g,'');
    }
  }
  const base='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title||'');
  return dates? base+'&dates='+dates : base;
}
/* calendar view state */
const _cnow=new Date(); let calY=_cnow.getFullYear(), calM=_cnow.getMonth();
let editingEventId=null, editingEntry=null;

/* ---------------- chrome (subtabs) ---------------- */
function renderChrome(){
  document.querySelectorAll('#wsSeg button').forEach(b=>b.classList.toggle('on',b.dataset.ws===ws));
  let membersHtml='';
  if(ws==='shared'){
    membersHtml=`<div class="members"><div class="avstack">${members.map(m=>avatar(m.id)).join('')}</div>
      <button class="btn sm" onclick="go(null,'share')">＋ เชิญ / แชร์</button></div>`;
  }
  $('#subbar').innerHTML=membersHtml;
  $('#subbar').style.display=membersHtml?'flex':'none';
  const me=mem(MEID);if(me){$('#uav').textContent=me.av;$('#uav').style.background=me.color;}
  $('#gearBtn').classList.toggle('on',tab==='settings');
  // floating bottom nav
  const nav=[['task','✅','Task'],['calendar','📅','ปฏิทิน'],['timeline','🕑','ไทม์ไลน์'],['expenses','💰','ค่าใช้จ่าย']];
  $('#tabbar').innerHTML=nav.map(([t,i,l])=>`<button class="tabbar-item ${tab===t?'on':''}" onclick="go('${t}')"><span>${i}</span><span class="tl">${l}</span></button>`).join('');
  // FAB visible only on the four main tabs (context-aware create)
  $('#fab').classList.toggle('hide',!['task','calendar','timeline','expenses'].includes(tab)||!!caseOpen);
}
function fabAction(){
  if(tab==='task') openTaskModal();
  else if(tab==='calendar') openDayModal(fabCalISO());
  else if(tab==='timeline') openCaseModal();
  else if(tab==='expenses') openExpenseModal();
}

/* ---------------- render ---------------- */
function render(){
  renderChrome();
  const m=$('#main');
  if(tab==='share'){m.innerHTML=viewShare();return;}
  if(tab==='settings'){m.innerHTML=viewSettings();return;}
  if(tab==='task') m.innerHTML=viewTasks();
  else if(tab==='calendar') m.innerHTML=viewCalendar();
  else if(tab==='timeline') m.innerHTML= caseOpen? viewCaseDetail(caseOpen): viewTimeline();
  else if(tab==='expenses') m.innerHTML=viewExpenses();
}
function pagehead(title,sub,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div style="flex:1"></div>${actions}</div>`;}

/* ---- Tasks ---- */
let taskFilter='all';
function taskRow(t){
  const done=t.status==='done';
  return `<div class="task ${done?'done':''}">
    <button class="check" onclick="toggleTask(${t.id})">${done?'✓':''}</button>
    <div class="t-body"><div class="t-title">${esc(t.title)} ${t.email?'<span class="mail-badge">📧 จากอีเมล</span>':''}</div>
      <div class="t-meta">${ptag(t.project)}<span class="pri ${t.pri}">${priLabel[t.pri]}</span><span class="due">📅 ${esc(t.due)}</span></div></div>
    ${t.assignee?avatar(t.assignee):''}
    <button class="del" onclick="editTask(${t.id})" title="แก้ไข">✏️</button>
    <button class="del" onclick="deleteTask(${t.id})" title="ลบ">✕</button>
  </div>`;
}
function editTask(id){openTaskModal(id);}
function deleteTask(id){if(!confirm('ลบงานนี้? การลบยกเลิกไม่ได้'))return;const d=D();d.tasks=d.tasks.filter(t=>t.id!==id);render();}
function viewTasks(){
  const d=D();let list=d.tasks.slice();
  if(taskFilter==='today')list=list.filter(t=>t.due==='วันนี้');
  else if(taskFilter!=='all')list=list.filter(t=>t.project===taskFilter);
  const chip=(v,l)=>`<button class="chip ${taskFilter===v?'on':''}" onclick="setFilter('${v}')">${l}</button>`;
  const doing=d.tasks.filter(t=>t.status==='doing').length, done=d.tasks.filter(t=>t.status==='done').length;
  return pagehead('Task · '+d.label,'จัดการงานและติดตามสถานะ','<button class="btn" onclick="openTaskModal()">＋ เพิ่มงาน</button>')
    +`<div class="cards" style="margin-bottom:18px">
        <div class="stat"><div class="blob" style="background:${PAL.coral}"></div><div class="k">งานทั้งหมด</div><div class="v">${d.tasks.length}</div></div>
        <div class="stat"><div class="blob" style="background:${PAL.sky}"></div><div class="k">กำลังทำ</div><div class="v">${doing}</div></div>
        <div class="stat"><div class="blob" style="background:${PAL.sage}"></div><div class="k">เสร็จแล้ว</div><div class="v">${done}</div></div>
        <div class="stat"><div class="blob" style="background:${PAL.butter}"></div><div class="k">โปรเจกต์</div><div class="v">${d.projects.length}</div></div>
      </div>`
    +`<div class="chips">${chip('all','ทั้งหมด')}${chip('today','วันนี้')}${d.projects.map(p=>chip(p.id,p.emoji+' '+p.name)).join('')}</div>`
    +`<div class="panel">${list.length?list.map(taskRow).join(''):'<div style="color:var(--muted);text-align:center;padding:24px">ไม่มีงานในหมวดนี้ 🎉</div>'}</div>`;
}
function setFilter(v){taskFilter=v;render();}
function toggleTask(id){const t=D().tasks.find(x=>x.id===id);t.status=t.status==='done'?'todo':'done';render();}

/* ---- Calendar ---- */
function calNav(delta){calM+=delta;if(calM<0){calM=11;calY--;}else if(calM>11){calM=0;calY++;}render();}
function calToday(){const n=new Date();calY=n.getFullYear();calM=n.getMonth();render();}
function viewCalendar(){
  const d=D();const dow=['อา','จ','อ','พ','พฤ','ศ','ส'];
  const first=new Date(calY,calM,1).getDay();
  const days=new Date(calY,calM+1,0).getDate();
  const t=new Date();const isThisMonth=t.getFullYear()===calY&&t.getMonth()===calM;
  let cells='';for(let i=0;i<first;i++)cells+=`<div class="cell dim"></div>`;
  for(let day=1;day<=days;day++){
    const iso=isoOf(calY,calM,day);
    const evs=d.events.filter(e=>e.date===iso);
    cells+=`<div class="cell ${isThisMonth&&day===t.getDate()?'today':''}" style="cursor:pointer" onclick="openDayModal('${iso}')">
      <div class="dn">${day}</div>
      ${evs.map(e=>`<div class="ev" style="background:${tint(e.color)}" title="${esc(e.title)}">${esc(e.title)}</div>`).join('')}</div>`;
  }
  const nav=`<div style="display:flex;gap:6px;align-items:center">
      <button class="btn ghost sm" onclick="calNav(-1)">‹</button>
      <div style="font-weight:800;min-width:118px;text-align:center">${THMONTH[calM]} ${calY+543}</div>
      <button class="btn ghost sm" onclick="calNav(1)">›</button>
      <button class="btn ghost sm" onclick="calToday()">วันนี้</button></div>`;
  return pagehead('ปฏิทิน · '+d.label,'แตะที่วันเพื่อเพิ่มหรือดูนัด · เพิ่มลง Google Calendar ได้ทีละรายการ',nav)
    +`<div class="cal"><div class="cal-head">${dow.map(x=>`<div>${x}</div>`).join('')}</div><div class="cal-grid">${cells}</div></div>`;
}
function fabCalISO(){const t=new Date();return (t.getFullYear()===calY&&t.getMonth()===calM)?todayISO():isoOf(calY,calM,1);}
// modal รายวัน: แสดงนัดของวันนั้น + เพิ่ม/แก้ไข/ลบ + ปุ่มเพิ่มลง Google Calendar
function openDayModal(iso){
  const d=D();
  const evs=d.events.filter(e=>e.date===iso);
  const opts=d.projects.map(p=>`<option value="${p.id}">${p.emoji} ${esc(p.name)}</option>`).join('');
  const editing=editingEventId?evs.find(e=>String(e.id)===String(editingEventId)):null;
  const list=evs.length?evs.map(e=>`<div class="exp" style="padding:10px 0">
      <div style="flex:1;min-width:0"><div class="et">${esc(e.title)}</div></div>
      <a class="del" href="${gcalUrl(e.title,e.date)}" target="_blank" rel="noopener" title="เพิ่มลง Google Calendar" style="text-decoration:none;display:flex;align-items:center;justify-content:center">📅</a>
      <button class="del" onclick="editEvent('${e.id}','${iso}')" title="แก้ไข">✏️</button>
      <button class="del" onclick="deleteEvent('${e.id}','${iso}')" title="ลบ">✕</button>
    </div>`).join(''):'<div style="color:var(--muted);padding:8px 0">ยังไม่มีนัดในวันนี้</div>';
  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this){editingEventId=null;closeModal();}"><div class="modal">
    <h3>📅 ${isoToThai(iso)}</h3>
    <div class="panel" style="box-shadow:none;padding:0 0 4px;border:none">${list}</div>
    <div class="section-title" style="margin-top:14px">${editing?'✏️ แก้ไขนัด':'＋ เพิ่มนัดใหม่'}</div>
    <label>ชื่อนัด</label><input class="field" id="evTitle" placeholder="เช่น พาน้องหาหมอฟัน" value="${editing?esc(editing.title):''}">
    <div class="row"><div style="flex:1"><label>วันที่</label><input class="field" id="evDate" type="date" value="${iso}"></div>
    <div style="flex:1"><label>หมวด (สี)</label><select class="field" id="evProj">${opts}</select></div></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="editingEventId=null;closeModal()">ปิด</button>
      <button class="btn" onclick="saveEvent('${iso}')">${editing?'บันทึกการแก้ไข':'เพิ่มนัด'}</button></div>
  </div></div>`;
}
function saveEvent(iso){
  const t=$('#evTitle').value.trim();if(!t){$('#evTitle').focus();return;}
  const dateVal=$('#evDate').value||iso;
  const pid=$('#evProj').value;const color=proj(pid)?proj(pid).color:PAL.sky;
  const d=D();
  if(editingEventId){const ev=d.events.find(x=>String(x.id)===String(editingEventId));if(ev){ev.title=t;ev.date=dateVal;ev.color=color;}editingEventId=null;}
  else{d.events.push({id:Date.now(),date:dateVal,title:t,color:color});}
  render();openDayModal(dateVal);
}
function editEvent(id,iso){editingEventId=id;openDayModal(iso);}
function deleteEvent(id,iso){if(!confirm('ลบนัดนี้?'))return;const d=D();d.events=d.events.filter(e=>String(e.id)!==String(id));editingEventId=null;render();openDayModal(iso);}

/* ---- Timeline (cases) ---- */
function viewTimeline(){
  const d=D();
  return pagehead('Timeline · '+d.label,'บันทึกเหตุการณ์เป็น “เคส” เรียงตามวัน เก็บเป็นหลักฐาน','<button class="btn" onclick="openCaseModal()">＋ เปิดเคสใหม่</button>')
    +`<div class="banner">🗂️ ฟีเจอร์เด่น: รวบรวมเหตุการณ์ทีละวันของเรื่องเดียว (เช่น ปัญหา Solar Cell) ให้เป็นไทม์ไลน์หลักฐานที่ย้อนดูได้</div>`
    +(d.cases.length?d.cases.map(c=>{
      const s=entriesSorted(c);const first=s[0],last=s[s.length-1];
      return `<div class="case" onclick="openCase('${c.id}')">
        <div class="case-top"><div class="cemoji" style="background:${tint(c.color)}">${c.emoji}</div>
          <div style="flex:1"><div class="cname">${esc(c.name)}</div><div class="cmeta">${c.entries.length} เหตุการณ์${last?' · ล่าสุด '+esc(entryDate(last)):''}</div></div>
          <span class="status ${c.status}">${statusLabel[c.status]}</span></div>
        ${first&&last?`<div class="case-foot">🕑 ${esc(entryDate(first))} → ${esc(entryDate(last))} · แตะเพื่อดูไทม์ไลน์ทั้งหมด →</div>`:'<div class="case-foot">แตะเพื่อดูไทม์ไลน์ →</div>'}
      </div>`;
    }).join(''):'<div style="color:var(--muted);text-align:center;padding:24px">ยังไม่มีเคส — กด “＋ เปิดเคสใหม่”</div>');
}
// เรียงเหตุการณ์ตามวันที่+เวลา (คงลำดับเดิมของรายการที่ไม่มีวันที่)
function entriesSorted(c){return (c.entries||[]).map((e,i)=>({e,i})).sort((a,b)=>(String(a.e.date||'')+(a.e.time||'')).localeCompare(String(b.e.date||'')+(b.e.time||''))).map(x=>x.e);}
function entryDate(e){return isoToThai(e.date)+(e.time?' '+e.time:'');}
function openCase(id){caseOpen=id;render();window.scrollTo(0,0);}
function viewCaseDetail(id){
  const c=D().cases.find(x=>x.id===id);
  const styles=['','pastel-sage','pastel-sky'];
  const ed=(editingEntry&&editingEntry.caseId===id)?c.entries[editingEntry.idx]:null;
  const sorted=c.entries.map((e,i)=>({e,i})).sort((a,b)=>(String(a.e.date||'')+(a.e.time||'')).localeCompare(String(b.e.date||'')+(b.e.time||'')));
  return `<div class="pagehead"><button class="btn ghost sm" onclick="closeCase()">← กลับ</button>
      <div style="margin-left:6px"><h1>${c.emoji} ${esc(c.name)}</h1><div class="sub">${c.entries.length} เหตุการณ์ · สถานะ: ${statusLabel[c.status]}</div></div>
      <div style="flex:1"></div><span class="status ${c.status}" style="align-self:center">${statusLabel[c.status]}</span></div>`
    +`<div class="panel">
        <div class="section-title" style="margin-top:0">${ed?'✏️ แก้ไขเหตุการณ์':'＋ เพิ่มเหตุการณ์'}</div>
        <div class="row" style="margin-bottom:10px">
          <div style="flex:1"><label style="display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px">วันที่</label><input class="field" id="ceDate" type="date" value="${ed?esc(ed.date||''):todayISO()}"></div>
          <div style="flex:1"><label style="display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px">เวลา</label><input class="field" id="ceTime" type="time" value="${ed?esc(ed.time||''):''}"></div>
        </div>
        <div class="addrow"><input class="field" id="ceWhat" placeholder="เกิดอะไรขึ้น…" value="${ed?esc(ed.what):''}"><button class="btn sm" onclick="addEntry('${id}')">${ed?'บันทึก':'＋ เพิ่ม'}</button>${ed?`<button class="btn ghost sm" onclick="cancelEntry()">ยกเลิก</button>`:''}</div>
        <div class="tl">${sorted.map((o,k)=>{const e=o.e;return `<div class="tl-item ${styles[k%3]}">
          <div class="tl-date">${esc(entryDate(e))}</div>
          <div class="tl-what">${esc(e.what)}</div>
          ${e.ev?`<span class="tl-ev">${esc(e.ev)}</span>`:''}
          <div style="margin-top:7px;display:flex;gap:6px">
            <button class="btn ghost sm" onclick="editEntry('${id}',${o.i})">✏️ แก้ไข</button>
            <button class="btn ghost sm" onclick="deleteEntry('${id}',${o.i})">✕ ลบ</button></div>
        </div>`;}).join('')||'<div style="color:var(--muted);padding:8px 0">ยังไม่มีเหตุการณ์</div>'}</div>
      </div>`;
}
function closeCase(){caseOpen=null;editingEntry=null;render();}
function addEntry(id){
  const c=D().cases.find(x=>x.id===id);const dt=$('#ceDate').value;const tm=$('#ceTime').value;const w=$('#ceWhat').value.trim();if(!w){$('#ceWhat').focus();return;}
  if(editingEntry&&editingEntry.caseId===id){const e=c.entries[editingEntry.idx];if(e){e.date=dt||todayISO();e.time=tm||'';e.what=w;}editingEntry=null;}
  else{c.entries.push({date:dt||todayISO(),time:tm||'',what:w,ev:''});}
  render();
}
function editEntry(id,idx){editingEntry={caseId:id,idx:idx};render();window.scrollTo(0,0);}
function cancelEntry(){editingEntry=null;render();}
function deleteEntry(id,idx){if(!confirm('ลบเหตุการณ์นี้? การลบยกเลิกไม่ได้'))return;const c=D().cases.find(x=>x.id===id);c.entries.splice(idx,1);if(editingEntry&&editingEntry.caseId===id)editingEntry=null;render();}
function openCaseModal(){
  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>＋ เปิดเคสใหม่</h3>
    <label>ชื่อเรื่อง / ปัญหา</label><input class="field" id="csName" placeholder="เช่น หลังคารั่วห้องนอน">
    <label>เหตุการณ์แรก (วันนี้)</label><input class="field" id="csFirst" placeholder="พบว่า…">
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn" onclick="saveCase()">เปิดเคส</button></div>
  </div></div>`;
}
function saveCase(){const n=$('#csName').value.trim();if(!n)return;const first=$('#csFirst').value.trim();

/* ---- Expenses ---- */
function viewExpenses(){
  const d=D();const list=d.expenses||[];
  const total=list.reduce((s,e)=>s+e.amount,0);
  // group by project
  const byProj={};list.forEach(e=>{byProj[e.project]=(byProj[e.project]||0)+e.amount;});
  const maxV=Math.max(1,...Object.values(byProj));
  const bars=d.projects.filter(p=>byProj[p.id]).map(p=>{
    const v=byProj[p.id];const pct=Math.round(v/maxV*100);
    return `<div class="bar-row"><div class="bl">${p.emoji} ${esc(p.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${p.color}"></div></div>
      <div class="bv">฿${baht(v)}</div></div>`;
  }).join('') || '<div style="color:var(--muted);text-align:center;padding:12px">ยังไม่มีข้อมูล</div>';
  const rows=list.length?list.slice().sort((a,b)=>b.id-a.id).map(expenseRow).join('')

        <div class="panel"><h3>🧾 รายการล่าสุด (${list.length})</h3>${rows}</div>

function deleteProject(id){

function saveTask(editId){
  const title=$('#ntTitle').value.trim();if(!title){$('#ntTitle').focus();return;}
  const d=D();
  if(editId){
    const t=d.tasks.find(x=>x.id===editId);
    if(t){t.title=title;t.project=$('#ntProj').value;t.due=$('#ntDue').value.trim()||'ไม่ระบุ';t.pri=$('#ntPri').value;
      if(ws==='shared'&&$('#ntAssign'))t.assignee=$('#ntAssign').value;}
  }else{
    const t={id:Date.now(),title,project:$('#ntProj').value,due:$('#ntDue').value.trim()||'ไม่ระบุ',pri:$('#ntPri').value,status:'todo',email:false};
    if(ws==='shared'&&$('#ntAssign'))t.assignee=$('#ntAssign').value;
    d.tasks.unshift(t);
  }
  closeModal();render();
}
function closeModal(){$('#modalRoot').innerHTML='';}

/* ---------------- nav ---------------- */
function go(t,special){ if(special){tab=special;} else if(t){tab=t;} caseOpen=null; render(); window.scrollTo(0,0);}
document.querySelectorAll('#wsSeg button').forEach(b=>b.addEventListener('click',()=>{ws=b.dataset.ws;tab='task';caseOpen=null;taskFilter='all';render();window.scrollTo(0,0);}));

/* ---------------- backend API (Apps Script) ---------------- */
async function api(action, extra){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   // text/plain = simple request, เลี่ยง CORS preflight
    body: JSON.stringify(Object.assign({token:ID_TOKEN, action}, extra||{})),
  });
  return res.json();
}
function setSync(state){
  const el=$('#syncPill'); if(!el) return;
  const map={busy:['busy','ซิงก์…'],ok:['ok','ซิงก์แล้ว'],err:['err','ออฟไลน์'],ro:['err','อ่านอย่างเดียว']};
  el.className='syncpill'+(map[state]?' '+map[state][0]:'');
  el.textContent=map[state]?map[state][1]:'';
}

/* ---------------- auth (Google Identity Services) ---------------- */
function initAuth(){
  if(!(window.google && google.accounts && google.accounts.id)){ setTimeout(initAuth,200); return; }
  google.accounts.id.initialize({ client_id:CLIENT_ID, callback:onGoogleCred });
  google.accounts.id.renderButton($('#gbtn'), {theme:'outline',size:'large',shape:'pill',text:'signin_with',width:260});
}
async function onGoogleCred(resp){
  ID_TOKEN = resp.credential;
  $('#loginErr').textContent='กำลังเข้าสู่ระบบ…';
  try{
    const r = await api('bootstrap');
    if(r.error){
      if(r.error==='not_a_member') $('#loginErr').textContent='อีเมล '+(r.email||'')+'\nยังไม่อยู่ในรายชื่อสมาชิก (แท็บ Members)\nเพิ่มอีเมลนี้ในชีตก่อน แล้วลองใหม่';
      else $('#loginErr').textContent='เข้าสู่ระบบไม่สำเร็จ: '+(r.message||r.error);
      ID_TOKEN=null; return;
    }
    applyBootstrap(r);
  }catch(e){ $('#loginErr').textContent='เชื่อมต่อ backend ไม่ได้: '+String(e.message||e); ID_TOKEN=null; }
}
function applyBootstrap(r){
  members = (r.members||[]).map(m=>({id:m.id,name:m.name,email:m.email,role:m.role,perm:m.perm||'view',color:m.color,av:m.av}));
  MEID = (r.me&&r.me.id) || 'me';
  DATA = r.DATA;
  ONLINE = true;
  lastPushed.personal = JSON.stringify(DATA.personal);
  lastPushed.shared   = JSON.stringify(DATA.shared);
  saveCache();
  $('#loginOverlay').style.display='none';
  setSync('ok');
  render();
}
function signOut(){
  try{ google.accounts.id.disableAutoSelect(); }catch(e){}
  ID_TOKEN=null; ONLINE=false;
  location.reload();
}
/* เชิญสมาชิกใหม่ — เพิ่มเข้าแท็บ Members ในชีตจริงผ่าน backend */
async function inviteMember(){
  const inp=$('#inviteEmail'); const msg=$('#inviteMsg');
  const email=((inp&&inp.value)||'').trim().toLowerCase();
  const perm=($('#invitePerm')&&$('#invitePerm').value)||'edit';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ if(msg)msg.textContent='กรุณาใส่อีเมลให้ถูกต้อง'; return; }
  if(members.some(m=>String(m.email).toLowerCase()===email)){ if(msg)msg.textContent='อีเมลนี้เป็นสมาชิกอยู่แล้ว'; return; }
  if(!ONLINE||!ID_TOKEN){ if(msg)msg.textContent='ต้องล็อกอินก่อนจึงจะเชิญได้'; return; }
  if(msg)msg.textContent='กำลังเพิ่มสมาชิก…';
  try{
    const r=await api('addMember',{email:email,perm:perm});
    if(r&&r.ok&&r.member){
      members.push({id:r.member.id,name:r.member.name,email:r.member.email,role:r.member.role,perm:r.member.perm,color:r.member.color,av:r.member.av});
      saveCache(); render();
      alert('เพิ่มสมาชิก '+r.member.name+' ('+r.member.email+') แล้ว');
    }else if(r&&r.error==='forbidden'){ if(msg)msg.textContent='คุณไม่มีสิทธิ์เชิญสมาชิก (ต้องเป็นเจ้าของหรือแก้ไขได้)'; }
    else if(r&&r.error==='exists'){ if(msg)msg.textContent='อีเมลนี้เป็นสมาชิกอยู่แล้ว'; }
    else if(r&&r.error==='bad_email'){ if(msg)msg.textContent='อีเมลไม่ถูกต้อง'; }
    else{ if(msg)msg.textContent='เพิ่มไม่สำเร็จ: '+((r&&(r.message||r.error))||'ไม่ทราบสาเหตุ'); }
  }catch(e){ if(msg)msg.textContent='เชื่อมต่อไม่ได้: '+String(e.message||e); }
}

/* ---------------- persistence: backend + local cache ---------------- */
const LS_KEY='taskme_v2';
function saveCache(){try{localStorage.setItem(LS_KEY,JSON.stringify({members,DATA,MEID}));}catch(e){}}
function loadCache(){try{const s=localStorage.getItem(LS_KEY);if(!s)return;const o=JSON.parse(s);
  if(o&&Array.isArray(o.members)&&o.DATA){members=o.members;DATA=o.DATA;if(o.MEID)MEID=o.MEID;}}catch(e){}}
function pushBackend(){
  if(!ONLINE || !ID_TOKEN) return;
  const cur=ws;
  if(JSON.stringify(DATA[cur])===lastPushed[cur]) return;   // ไม่มีอะไรเปลี่ยน
  if(cur==='shared' && !canEdit()){ setSync('ro'); return; }
  setSync('busy');
  clearTimeout(pushTimer);
  pushTimer=setTimeout(async ()=>{
    const snap=JSON.stringify(DATA[cur]);
    try{
      const r=await api('save',{workspace:cur,data:DATA[cur]});
      if(r&&r.ok){ lastPushed[cur]=snap; setSync('ok'); }
      else if(r&&r.error==='forbidden'){ setSync('ro'); }
      else { setSync('err'); }
    }catch(e){ setSync('err'); }
  },700);
}
function saveState(){ saveCache(); pushBackend(); }
function resetState(){
  if(!confirm('ล้างข้อมูลที่แคชในเครื่องนี้ แล้วโหลดใหม่จาก Google Sheet?'))return;
  try{localStorage.removeItem(LS_KEY);}catch(e){}
  location.reload();
}

loadCache();
const _render=render;
render=function(){_render();saveState();};

render();          // แสดงข้อมูลแคช/ตัวอย่างไว้เบื้องหลัง overlay
initAuth();        // เปิดปุ่มล็อกอิน Google
</script>
